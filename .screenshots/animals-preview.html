<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>森林小伙伴 · 重绘预览</title><style>*{box-sizing:border-box}body{margin:0;background:#f8f5ee;color:#715d50;font-family:system-ui,-apple-system,sans-serif;padding:64px}main{max-width:1050px;margin:auto}small{letter-spacing:4px;color:#9b9f87}h1{font-size:38px;font-weight:600;margin:16px 0}p{color:#998a7c;font-size:15px}.grid{display:flex;gap:22px;margin-top:42px}.card{flex:1;background:#fffdf8;border:1px solid #e9e1d4;border-radius:28px;text-align:center;padding:30px 18px}.art{width:230px;height:230px;max-width:100%}h2{font-size:19px;font-weight:500;margin:8px}.mini{width:56px;height:56px;margin-top:16px}.note{margin-top:32px;font-size:12px;letter-spacing:1px}@media(max-width:650px){body{padding:28px}.grid{flex-direction:column}}</style><main><small>WOODLAND FRIENDS / 01</small><h1>软乎乎的森林小伙伴</h1><p>奶油色 · 柔和轮廓 · 一点点腮红</p><div id="app"></div><p class="note">下方为实际小尺寸预览 · SVG 绘制，放大依然清晰</p></main><script type="module">
import {createApp,h} from 'vue';import AnimalArtwork from '/src/components/AnimalArtwork.vue';
createApp({render:()=>h('div',{class:'grid'},[['cat','奶油小猫','橘色斑纹 / 薄荷围巾'],['fox','杏桃狐狸','蓬松大尾巴 / 奶白脸颊'],['bear','蜂蜜小熊','圆圆耳朵 / 温暖燕麦棕']].map(([animal,name,desc])=>h('article',{class:'card'},[h('svg',{class:'art',viewBox:'0 0 100 100'},[h(AnimalArtwork,{animal})]),h('h2',name),h('p',desc),h('svg',{class:'mini',viewBox:'0 0 100 100'},[h(AnimalArtwork,{animal})])])))}).mount('#app');</script></html>
